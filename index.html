<style>

}

.g3p .pc i{font-size:min(10vh,8vw)}.g3p .pc b{font-size:min(3vh,2.4vw)}.g4p .pc i{font-size:min(7.5vh,6vw)}.g4p .pc b{font-size:min(2.4vh,2vw)}
@media (orientation:portrait){.pc i{font-size:min(3.6vh,8vw)}.pc b{font-size:min(1.4vh,3vw)}.g3p .pc i{font-size:min(6.5vh,14vw)}.g3p .pc b{font-size:min(2vh,4.2vw)}.g4p .pc i{font-size:min(5vh,11vw)}.g4p .pc b{font-size:min(1.7vh,3.6vw)}}
.pc.free{background:var(--free)}

<div class="wrap">
<header class="mast"><h1>Bingo Maker</h1><p>Picture bingo for speech practice.</p></header>
<div class="set">
 <div>
  <div class="f"><label for="words">Words, one per line. Put an emoji first to choose the picture.</label><textarea id="words" spellcheck="false"></textarea>
  <div class="info" id="info"></div><div class="chips" id="chips"></div></div>
 </div>
 <div>
  <div class="f"><label for="title">Title</label><input type="text" id="title" maxlength="40"></div>
  <div class="f"><label for="preset">Start from a word set</label><select id="preset"><option value="">Choose a word set…</option></select></div>
  <div class="f"><span class="lab" id="lab-size">Grid</span><div class="seg" id="size" role="group" aria-labelledby="lab-size"><button data-v="3">3×3</button><button data-v="4">4×4</button><button data-v="5">5×5</button></div></div>
  <div class="f"><span class="lab" id="lab-n">Cards</span><div class="seg" id="ncards" role="group" aria-labelledby="lab-n"><button data-v="1">1</button><button data-v="2">2</button><button data-v="4">4</button><button data-v="6">6</button><button data-v="8">8</button></div></div>
  <label class="chk"><input type="checkbox" id="free"> Free square in the middle</label>
  <label class="chk"><input type="checkbox" id="calls"> Call cards</label>
  <p class="info">Most kid words get a picture on their own. Tap a word under the list to change its picture or remove it.</p>
 </div>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={title:"S-Blend Bingo",words:PRESETS0[0][2],size:5,n:4,free:true,calls:true};
try{Object.assign(ST,JSON.parse(localStorage.getItem("bingo-maker")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("bingo-maker",JSON.stringify(ST))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function parse(){const out=[],seen=new Set();ST.words.split(/\n|,/).forEach(l=>{l=l.trim();if(!l)return;let pic="",w=l;
   const m=l.match(/^(\S+)\s+(.+)$/);if(m&&!/[A-Za-z0-9]/.test(m[1])){pic=m[1];w=m[2].trim()}else{const m2=l.match(/^(.+?)\s+(\S+)$/);if(m2&&!/[A-Za-z0-9]/.test(m2[2])){pic=m2[2];w=m2[1].trim()}}
   if(!pic)pic=picFor(w);const k=w.toLowerCase();if(seen.has(k))return;seen.add(k);out.push([pic,w])});return out}
let CARDS=[],W=[];
function need(){const n=ST.size;return n*n-(ST.free&&n%2?1:0)}
function deal(){W=parse();const q=need();CARDS=Array.from({length:ST.n},()=>{let pool=[];while(pool.length<q&&W.length)pool=pool.concat(shuffle(W));return pool.slice(0,q)})}
function cardHTML(sq,k){const n=ST.size,mid=Math.floor(n*n/2),cells=sq.slice();if(ST.free&&n%2)cells.splice(mid,0,["⭐","FREE",1]);
  return `<div class="card"><h2>${esc(ST.title||"Bingo")}<small>Card ${k}</small></h2><div class="grid g${n}" style="grid-template-columns:repeat(${n},1fr)">${n===5?"BINGO".split("").map(x=>`<div class="hd">${x}</div>`).join(""):""}${cells.map(x=>`<div class="c ${x[2]?"free":""} ${x[0]?"":"nopic"}">${x[0]?`<i>${x[0]}</i>`:""}<b>${esc(x[1])}</b></div>`).join("")}</div></div>`}
function callHTML(){if(!ST.calls||!W.length)return "";let h="";for(let i=0;i<W.length;i+=24){h+=`<div class="card callpage"><h2>${esc(ST.title||"Bingo")}<small>Call cards${W.length>24?" "+(i/24+1):""}, cut along the dashed lines</small></h2><div class="cgrid">${W.slice(i,i+24).map(x=>`<div class="cc">${x[0]?`<i>${x[0]}</i>`:""}<b>${esc(x[1])}</b></div>`).join("")}</div></div>`}return h}
function render(){document.getElementById("cards").innerHTML=W.length?CARDS.map((c,i)=>cardHTML(c,i+1)).join("")+callHTML():`<div class="card" style="text-align:center;color:var(--muted);padding:30px">Type or paste some words to make cards.</div>`;
  const q=need(),inf=document.getElementById("info");
  inf.textContent=`${W.length} word${W.length===1?"":"s"} for ${q} squares per card.`+(W.length&&W.length<q?` Add ${q-W.length} more, or words will repeat.`:W.length>q?" Each card gets a different mix.":"");
  inf.className="info"+(W.length&&W.length<q?" warn":"");
  chipsDraw();
  document.querySelectorAll("#size button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===ST.size));
  document.querySelectorAll("#ncards button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===ST.n));
  const fr=document.getElementById("free");fr.checked=ST.free;fr.disabled=ST.size%2===0;}
function all(){deal();render();save()}
const $=id=>document.getElementById(id);
$("preset").innerHTML+=[...new Set(PRESETS.map(p=>p[0]))].map(g=>`<optgroup label="${esc(g)}">${PRESETS.map((p,i)=>p[0]===g?`<option value="${i}">${esc(p[1])}${p[0]==="My sets"?"":" ("+p[3].split("\n").length+" words)"}</option>`:"").join("")}</optgroup>`).join("");
$("words").value=ST.words;$("title").value=ST.title;$("calls").checked=ST.calls;
let tm;$("words").oninput=e=>{ST.words=e.target.value;clearTimeout(tm);tm=setTimeout(all,350)};
$("title").oninput=e=>{ST.title=e.target.value;render();save()};
$("preset").onchange=e=>{const p=PRESETS[+e.target.value];if(!p)return;ST.words=p[3];ST.title=p[2];$("words").value=p[3];$("title").value=p[2];e.target.value="";all()};
$("size").onclick=e=>{const b=e.target.closest("button");if(!b)return;ST.size=+b.dataset.v;all()};
$("ncards").onclick=e=>{const b=e.target.closest("button");if(!b)return;ST.n=+b.dataset.v;all()};
$("free").onchange=e=>{ST.free=e.target.checked;all()};
$("calls").onchange=e=>{ST.calls=e.target.checked;render();save()};
$("shuf").onclick=all;

let CED=null;
function chipsDraw(){const el=document.getElementById("chips");
  el.innerHTML=W.map((x,i)=>`<button type="button" class="chip ${x[0]?"":"no"} ${CED===i?"on":""}" data-k="${i}" title="Edit ${esc(x[1])}">${x[0]?x[0]+" ":""}${esc(x[1])}</button>`).join("")+`<button type="button" class="chip add ${CED===-1?"on":""}" data-k="-1">Add word</button>`+
  (CED!=null?`<div class="ced"><label class="cf"><span class="lab">Picture</span><input type="text" id="ced-p" maxlength="8" value="${CED>=0?esc(W[CED][0]):""}" placeholder="emoji"></label><label class="cf grow"><span class="lab">Word</span><input type="text" id="ced-w" maxlength="30" value="${CED>=0?esc(W[CED][1]):""}"></label><div class="cbtns"><button type="button" class="btn pri" data-ced="save">${CED>=0?"Save":"Add"}</button>${CED>=0?`<button type="button" class="btn" data-ced="del">Remove</button>`:""}<button type="button" class="btn" data-ced="x">Cancel</button></div></div>`:"")}
function cedWrite(list){ST.words=list.map(([p,w])=>(p?p+" ":"")+w).join("\n");$("words").value=ST.words;CED=null;all()}
$("chips").addEventListener("click",e=>{const c=e.target.closest(".chip");if(c){const k=+c.dataset.k;CED=CED===k?null:k;chipsDraw();setTimeout(()=>{const i=$(k===-1?"ced-w":"ced-p");if(i)i.focus()},0);return}
  const b=e.target.closest("[data-ced]");if(!b)return;const a=b.dataset.ced;
  if(a==="x"){CED=null;chipsDraw();return}
  const list=W.slice();
  if(a==="del"){list.splice(CED,1);cedWrite(list);return}
  const w=($("ced-w").value||"").trim();let p=($("ced-p").value||"").trim();if(!w){flash("Type a word first.");return}if(!p)p=picFor(w);
  if(CED>=0)list[CED]=[p,w];else list.push([p,w]);cedWrite(list)});
$("chips").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.closest(".ced")){e.preventDefault();$("chips").querySelector('[data-ced="save"]').click()}if(e.key==="Escape"&&CED!=null){CED=null;chipsDraw()}});
let bag=[],called=[];
function callNext(){if(!W.length)return;if(!bag.length){bag=shuffle(W);called=[]}const x=bag.pop();called.push(x);const d=$("draw");
  d.innerHTML=`<div class="dbox"><span class="dn">${called.length} of ${W.length}</span>${x[0]?`<i>${x[0]}</i>`:""}<b>${esc(x[1])}</b><div class="dbtn"><button class="btn pri" id="dnext">${bag.length?"Next word":"Start again"}</button><button class="btn" id="dx">Close</button></div><div class="dlist">${called.slice(0,-1).reverse().map(y=>`<span>${y[0]} ${esc(y[1])}</span>`).join("")}</div></div>`;
  d.hidden=false;$("dnext").onclick=callNext;$("dx").onclick=()=>{d.hidden=true}}
$("call").onclick=callNext;

/* ---------- play on screen: two boards ---------- */
const TOKS=["dot","⭐","❤️","🕷️","🚗","🦖","🐸","🍪","⚽","🦄"],TCOL=["red","blue","green","purple","orange","pink"];
const P={names:["Me","You"],hide:false,auto:true,tok:[{t:"dot",c:"red"},{t:"dot",c:"blue"}]};try{Object.assign(P,JSON.parse(localStorage.getItem("bingo-play")||"{}"))}catch(e){}
if(!Array.isArray(P.tok)||P.tok.length<2)P.tok=[{t:"dot",c:"red"},{t:"dot",c:"blue"}];
function psave(){try{localStorage.setItem("bingo-play",JSON.stringify({names:P.names,hide:P.hide,auto:P.auto,tok:P.tok}))}catch(e){}}
function pnew(){const q=need(),n=ST.size,mid=Math.floor(n*n/2);P.boards=[0,1].map(()=>{let pool=[];while(pool.length<q&&W.length)pool=pool.concat(shuffle(W));const cells=pool.slice(0,q).map(x=>({p:x[0],w:x[1]}));if(ST.free&&n%2)cells.splice(mid,0,{p:"⭐",w:"FREE",free:1});return {cells,on:new Set(ST.free&&n%2?[mid]:[]),won:false}});
  P.bag=shuffle(W);P.cur=null;P.called=[];P.winner=null}
function lines(n){const L=[];for(let r=0;r<n;r++){L.push([...Array(n)].map((_,c)=>r*n+c));L.push([...Array(n)].map((_,c)=>c*n+r))}L.push([...Array(n)].map((_,i)=>i*n+i));L.push([...Array(n)].map((_,i)=>i*n+n-1-i));return L}
function pdraw(){const n=ST.size,el=$("play"),c=P.cur;
  el.innerHTML=`<div class="ptop"><button class="pbtn" data-p="close">Close</button>
    <div class="pcall">${c?(P.hide?`<span class="hid">Listen for the word</span>`:`${c[0]?`<i>${c[0]}</i>`:""}<b>${esc(c[1])}</b>`):`<span class="wait">Tap Call to start</span>`}</div>
    <button class="pbtn" data-p="hide" aria-pressed="${P.hide}" title="${P.hide?"Show the called word":"Hide the called word so they have to listen"}">Hide word</button>
    <button class="pbtn" data-p="auto" aria-pressed="${P.auto}" title="${P.auto?"Auto-marking is on: called words mark themselves":"Tap to mark: players mark their own squares"}">Auto-mark</button><button class="callbig" data-p="call">${P.bag.length?"Call":"New game"}</button></div>
   <div class="called">${P.called.slice(0,-1).reverse().map(x=>`<span>${x[0]} ${esc(x[1])}</span>`).join("")}</div>
   <div class="boards">${P.boards.map((B,bi)=>`<div class="pb b${bi+1} ${B.won?"win":""}" style="--pc:var(--tok-${P.tok[bi].c})"><h3><input data-name="${bi}" value="${esc(P.names[bi])}" maxlength="12" aria-label="Player name"><button class="tokbtn" data-p="tok" data-v="${bi}" aria-expanded="${P.pick===bi}" aria-label="Change ${esc(P.names[bi])}'s token"><span class="dab mini" style="--dc:var(--tok-${P.tok[bi].c})">${P.tok[bi].t==="dot"?"":P.tok[bi].t}</span></button><span class="cnt">${B.won?"Bingo!":""}</span></h3>
     ${P.pick===bi?`<div class="tokpick"><div class="tkrow">${TCOL.map(c=>`<button class="sw ${P.tok[bi].c===c?"on":""}" data-p="tcol" data-b2="${bi}" data-v="${c}" aria-label="${c}" style="--dc:var(--tok-${c})"></button>`).join("")}</div><div class="tkrow">${TOKS.map(t=>`<button class="tk ${P.tok[bi].t===t?"on":""}" data-p="ttok" data-b2="${bi}" data-v="${t}" aria-label="${t==="dot"?"plain dot":t}"><span class="dab mini" style="--dc:var(--tok-${P.tok[bi].c})">${t==="dot"?"":t}</span></button>`).join("")}</div></div>`:""}
     <div class="pgrid g${n}p" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)">${B.cells.map((x,i)=>`<${P.auto?"div":"button"} class="pc ${x.free?"free":""} ${B.on.has(i)?"on":""} ${P.auto?"ro":""}" data-b="${bi}" data-i="${i}">${x.p?`<i>${x.p}</i>`:""}<b>${esc(x.w)}</b>${B.on.has(i)?`<span class="dab ${P.fresh===bi+":"+i?"new":""}" style="--dc:var(--tok-${P.tok[bi].c})">${P.tok[bi].t==="dot"?"":P.tok[bi].t}</span>`:""}</${P.auto?"div":"button"}>`).join("")}</div></div>`).join("")}</div>
   <div class="pwin" id="pwin" ${P.winner!=null&&P.showWin?"":"hidden"}><div><b>Bingo!</b><span class="wn">${esc(P.names[P.winner]||"")} wins</span><div class="dbtn"><button class="btn pri" data-p="again">New game</button><button class="btn" data-p="keep">Keep playing</button></div></div></div>`}
function pcheck(bi){const B=P.boards[bi];if(B.won)return;const n=ST.size;if(lines(n).some(l=>l.every(i=>B.on.has(i)))){B.won=true;if(P.winner==null){P.winner=bi;P.showWin=true}}}
$("playbtn").onclick=()=>{if(!W.length){flash("Add some words first.");return}pnew();$("play").hidden=false;document.documentElement.style.overflow="hidden";pdraw()};
$("play").addEventListener("click",e=>{const t=e.target.closest("[data-p],[data-b]");if(!t)return;
  if(t.dataset.b!=null){if(P.auto)return;const B=P.boards[+t.dataset.b],i=+t.dataset.i;if(B.cells[i].free)return;B.on.has(i)?B.on.delete(i):B.on.add(i);pcheck(+t.dataset.b);pdraw();return}
  const a=t.dataset.p;
  if(a==="close"){$("play").hidden=true;document.documentElement.style.overflow="";return}
  if(a==="tok"){const v=+t.dataset.v;P.pick=P.pick===v?null:v;pdraw();return}
  if(a==="tcol"){P.tok[+t.dataset.b2].c=t.dataset.v;psave();pdraw();return}
  if(a==="ttok"){P.tok[+t.dataset.b2].t=t.dataset.v;psave();pdraw();return}
  if(a==="hide"){P.hide=!P.hide;psave();pdraw();return}
  if(a==="call"){if(!P.bag.length){pnew();pdraw();return}P.cur=P.bag.pop();P.called.push(P.cur);P.fresh=null;if(P.auto){const k=P.cur[1].toLowerCase();P.boards.forEach((B,bi)=>{B.cells.forEach((x,i)=>{if(!x.free&&x.w.toLowerCase()===k){B.on.add(i);P.fresh=null}});pcheck(bi)})}pdraw();return}
  if(a==="auto"){P.auto=!P.auto;psave();pdraw();flash(P.auto?"Auto-mark on: called words mark themselves.":"Tap to mark: players mark their own squares.");return}
  if(a==="again"){pnew();pdraw();return}
  if(a==="keep"){P.showWin=false;pdraw();return}});
$("play").addEventListener("input",e=>{const t=e.target.closest("[data-name]");if(!t)return;P.names[+t.dataset.name]=t.value;psave()});
let DL=null;(async()=>{try{if(window.claude&&claude.use)DL=await claude.use("downloads")}catch(e){}})();
function flash(t){const m=$("msg");m.textContent=t;m.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(()=>m.hidden=true,4000)}
function loadJS(u){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
$("pdf").onclick=async()=>{const b=$("pdf");if(!W.length){flash("Add some words first.");return}
  b.disabled=true;const t=b.textContent;b.textContent="Making PDF…";
  try{if(!window.html2canvas)await loadJS("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    if(!window.jspdf)await loadJS("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const host=$("pdfhost"),parts=[...document.querySelectorAll("#cards .card")],pdf=new jspdf.jsPDF({unit:"mm",format:"a4"});
    for(let i=0;i<parts.length;i++){host.innerHTML=`<div class="pg">${parts[i].outerHTML}</div>`;const cv=await html2canvas(host.firstChild,{scale:2,backgroundColor:"#fff",logging:false});if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297)}
    host.innerHTML="";const fn=(ST.title||"bingo").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"bingo";
    if(DL)await DL.save({filename:fn+".pdf",data:pdf.output("arraybuffer")});else pdf.save(fn+".pdf");flash("Saved. Open the PDF and print it.")}
  catch(e){const c=e&&e.code;flash(c==="declined"?"Download cancelled.":c==="rate_limited"?"One moment, then try again.":"Couldn't make the PDF. Try again.")}
  b.disabled=false;b.textContent=t};
all();
</script></body></html>
