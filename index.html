function emojiSuggest(q){q=String(q||"").toLowerCase().trim();if(!q)return [];const sc=new Map();const add=(e,s)=>{if(e&&(!sc.has(e)||sc.get(e)<s))sc.set(e,s)};
  add(picFor(q),10);const sing=q.replace(/(ies)$/,"y").replace(/(es|s)$/,"");
  EIDX.forEach(([e,ks])=>{let s=0;ks.forEach(k=>{const ws=k.split(" ");if(k===q||k===sing)s=Math.max(s,8);else if(ws.includes(q)||ws.includes(sing))s=Math.max(s,6);else if(q.length>=3&&ws.some(w=>w.startsWith(q)))s=Math.max(s,4);else if(q.length>=4&&k.includes(q))s=Math.max(s,2)});if(s)add(e,s)});
  return [...sc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0])}
function sugDraw(){const box=document.getElementById("ced-sug");if(!box)return;const pi=$("ced-p"),q=/[a-z]/i.test(pi.value)?pi.value:$("ced-w").value;const s=emojiSuggest(q);
  box.innerHTML=s.length?s.map(e=>`<button type="button" class="sg ${pi.value===e?"on":""}" data-sg="${e}" aria-label="Use ${e}">${e}</button>`).join(""):`<span class="info">No picture found. Try another word in the picture box, like "dog".</span>`}
let CED=null;
function topUp(){const p=PRESETS[+$("topsel").value];if(!p)return;const have=new Set(W.map(x=>x[1].toLowerCase()));const extra=shuffle(p[3].split("\n").map(s=>s.trim()).filter(Boolean)).filter(l=>{const w=l.replace(/^\S+\s+/,m=>/[A-Za-z0-9]/.test(m)?m:"").trim().toLowerCase();return !have.has(w)});
  const n=need()-W.length;if(!extra.length){flash("That set has no new words. Try another one.");return}ST.words=(ST.words.trim()+"\n"+extra.slice(0,n).join("\n")).trim();$("words").value=ST.words;all();flash(`Added ${Math.min(n,extra.length)} words from ${p[1]}.`)}
function chipsDraw(){const el=document.getElementById("chips");
  el.innerHTML=W.map((x,i)=>`<button type="button" class="chip ${x[0]?"":"no"} ${CED===i?"on":""}" data-k="${i}" title="Edit ${esc(x[1])}">${x[0]?x[0]+" ":""}${esc(x[1])}</button>`).join("")+`<button type="button" class="chip add ${CED===-1?"on":""}" data-k="-1">Add word</button>`+
  (CED!=null?`<div class="ced"><label class="cf"><span class="lab">Picture</span><input type="text" id="ced-p" maxlength="8" value="${CED>=0?esc(W[CED][0]):""}" placeholder="search"></label><label class="cf grow"><span class="lab">Word</span><input type="text" id="ced-w" maxlength="30" value="${CED>=0?esc(W[CED][1]):""}"></label><div class="sug" id="ced-sug" aria-label="Suggested pictures"></div><div class="cbtns"><button type="button" class="btn pri" data-ced="save">${CED>=0?"Save":"Add"}</button>${CED>=0?`<button type="button" class="btn" data-ced="del">Remove</button>`:""}<button type="button" class="btn" data-ced="x">Cancel</button></div></div>`:"")}
function cedWrite(list){ST.words=list.map(([p,w])=>(p?p+" ":"")+w).join("\n");$("words").value=ST.words;CED=null;all()}
$("chips").addEventListener("input",e=>{if(e.target.id==="ced-w"||e.target.id==="ced-p")sugDraw()});
$("chips").addEventListener("click",e=>{const g=e.target.closest("[data-sg]");if(g){$("ced-p").value=g.dataset.sg;sugDraw();$("ced-w").focus();return}const c=e.target.closest(".chip");if(c){const k=+c.dataset.k;CED=CED===k?null:k;chipsDraw();sugDraw();setTimeout(()=>{const i=$(k===-1?"ced-w":"ced-p");if(i)i.focus()},0);return}
  const b=e.target.closest("[data-ced]");if(!b)return;const a=b.dataset.ced;
  if(a==="x"){CED=null;chipsDraw();return}
  const list=W.slice();
  if(a==="del"){list.splice(CED,1);cedWrite(list);return}
  const w=($("ced-w").value||"").trim();let p=($("ced-p").value||"").trim();if(/[a-z]/i.test(p))p=emojiSuggest(p)[0]||"";if(!w){flash("Type a word first.");return}if(!p)p=picFor(w);
  if(CED>=0)list[CED]=[p,w];else list.push([p,w]);cedWrite(list)});
$("chips").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.closest(".ced")){e.preventDefault();$("chips").querySelector('[data-ced="save"]').click()}if(e.key==="Escape"&&CED!=null){CED=null;chipsDraw()}});
let bag=[],called=[];
function callNext(){if(!W.length)return;if(!bag.length){bag=shuffle(W);called=[]}const x=bag.pop();called.push(x);const d=$("draw");

  d.hidden=false;$("dnext").onclick=callNext;$("dx").onclick=()=>{d.hidden=true}}

try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}
function psave(){try{localStorage.setItem("bingo-play",JSON.stringify({names:P.names,hide:P.hide,auto:P.auto,tok:P.tok,voice:P.voice}))}catch(e){}}
function pnew(){const q=need(),n=ST.size,mid=Math.floor(n*n/2);P.boards=[0,1].map(()=>{let pool=[];while(pool.length<q&&W.length)pool=pool.concat(shuffle(W));const cells=pool.slice(0,q).map(x=>({p:x[0],w:x[1]}));if(ST.free&&n%2)cells.splice(mid,0,{p:"⭐",w:"FREE",free:1});return {cells,on:new Set(ST.free&&n%2?[mid]:[]),won:false}});
  P.bag=shuffle(W);P.cur=null;P.called=[];P.winner=null}
function lines(n){const L=[];for(let r=0;r<n;r++){L.push([...Array(n)].map((_,c)=>r*n+c));L.push([...Array(n)].map((_,c)=>c*n+r))}L.push([...Array(n)].map((_,i)=>i*n+i));L.push([...Array(n)].map((_,i)=>i*n+n-1-i));return L}
function pdraw(){const n=ST.size,el=$("play"),c=P.cur;
  el.innerHTML=`<div class="ptop"><button class="pbtn" data-p="close">Close</button>
    <div class="pcall" ${c?'data-p="replay" role="button" tabindex="0" title="Hear it again"':""}>${c?(P.hide?`<span class="hid">Listen for the word</span>`:`${c[0]?`<i>${c[0]}</i>`:""}<b>${esc(c[1])}</b>`):`<span class="wait">Tap Call to start</span>`}</div>
    <button class="pbtn" data-p="voice" aria-pressed="${P.voice}" title="Read the called word aloud">Say it</button><button class="pbtn" data-p="hide" aria-pressed="${P.hide}" title="${P.hide?"Show the called word":"Hide the called word so they have to listen"}">Hide word</button>
    <button class="pbtn" data-p="auto" aria-pressed="${P.auto}" title="${P.auto?"Auto-marking is on: called words mark themselves":"Tap to mark: players mark their own squares"}">Auto-mark</button><button class="callbig" data-p="call">${P.bag.length?"Call":"New game"}</button></div>
   <div class="called">${P.called.slice(0,-1).reverse().map(x=>`<span>${x[0]} ${esc(x[1])}</span>`).join("")}</div>
   <div class="boards">${P.boards.map((B,bi)=>`<div class="pb b${bi+1} ${B.won?"win":""}" style="--pc:var(--tok-${P.tok[bi].c})"><h3><input data-name="${bi}" value="${esc(P.names[bi])}" maxlength="12" aria-label="Player name"><button class="tokbtn" data-p="tok" data-v="${bi}" aria-expanded="${P.pick===bi}" aria-label="Change ${esc(P.names[bi])}'s token"><span class="dab mini" style="--dc:var(--tok-${P.tok[bi].c})">${P.tok[bi].t==="dot"?"":P.tok[bi].t}</span></button><span class="cnt">${B.won?"Bingo!":""}</span></h3>
     ${P.pick===bi?`<div class="tokpick"><div class="tkrow">${TCOL.map(c=>`<button class="sw ${P.tok[bi].c===c?"on":""}" data-p="tcol" data-b2="${bi}" data-v="${c}" aria-label="${c}" style="--dc:var(--tok-${c})"></button>`).join("")}</div><div class="tkrow">${TOKS.map(t=>`<button class="tk ${P.tok[bi].t===t?"on":""}" data-p="ttok" data-b2="${bi}" data-v="${t}" aria-label="${t==="dot"?"plain dot":t}"><span class="dab mini" style="--dc:var(--tok-${P.tok[bi].c})">${t==="dot"?"":t}</span></button>`).join("")}</div></div>`:""}
     <div class="pgrid g${n}p" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)">${B.cells.map((x,i)=>`<${P.auto?"div":"button"} class="pc ${x.free?"free":""} ${B.on.has(i)?"on":""} ${P.auto?"ro":""}" data-b="${bi}" data-i="${i}">${x.p?`<i>${x.p}</i>`:""}<b>${esc(x.w)}</b>${B.on.has(i)?`<span class="dab ${P.fresh===bi+":"+i?"new":""}" style="--dc:var(--tok-${P.tok[bi].c})">${P.tok[bi].t==="dot"?"":P.tok[bi].t}</span>`:""}</${P.auto?"div":"button"}>`).join("")}</div></div>`).join("")}</div>
   <div class="pwin" id="pwin" ${P.winner!=null&&P.showWin?"":"hidden"}><div><b>Bingo!</b><span class="wn">${esc(P.names[P.winner]||"")} wins</span><div class="dbtn"><button class="btn pri" data-p="again">New game</button><button class="btn" data-p="keep">Keep playing</button></div></div></div>`}
function pcheck(bi){const B=P.boards[bi];if(B.won)return;const n=ST.size;if(lines(n).some(l=>l.every(i=>B.on.has(i)))){B.won=true;if(P.winner==null){P.winner=bi;P.showWin=true}}}
$("playbtn").onclick=()=>{if(!W.length){flash("Add some words first.");return}pnew();$("play").hidden=false;document.documentElement.style.overflow="hidden";pdraw()};
$("play").addEventListener("click",e=>{const t=e.target.closest("[data-p],[data-b]");if(!t)return;
  if(t.dataset.b!=null){if(P.auto)return;const B=P.boards[+t.dataset.b],i=+t.dataset.i;if(B.cells[i].free)return;B.on.has(i)?B.on.delete(i):B.on.add(i);pcheck(+t.dataset.b);pdraw();return}
  const a=t.dataset.p;
  if(a==="close"){$("play").hidden=true;document.documentElement.style.overflow="";return}
  if(a==="tok"){const v=+t.dataset.v;P.pick=P.pick===v?null:v;pdraw();return}
  if(a==="tcol"){P.tok[+t.dataset.b2].c=t.dataset.v;psave();pdraw();return}
  if(a==="ttok"){P.tok[+t.dataset.b2].t=t.dataset.v;psave();pdraw();return}
  if(a==="replay"){const v=P.voice;P.voice=true;say(P.cur&&P.cur[1]);P.voice=v;return}
  if(a==="voice"){P.voice=!P.voice;psave();pdraw();if(P.voice&&P.cur)say(P.cur[1]);return}
  if(a==="hide"){P.hide=!P.hide;psave();pdraw();return}
  if(a==="call"){if(!P.bag.length){pnew();pdraw();return}P.cur=P.bag.pop();P.called.push(P.cur);say(P.cur[1]);P.fresh=null;if(P.auto){const k=P.cur[1].toLowerCase();P.boards.forEach((B,bi)=>{B.cells.forEach((x,i)=>{if(!x.free&&x.w.toLowerCase()===k){B.on.add(i);P.fresh=null}});pcheck(bi)})}pdraw();return}
  if(a==="auto"){P.auto=!P.auto;psave();pdraw();flash(P.auto?"Auto-mark on: called words mark themselves.":"Tap to mark: players mark their own squares.");return}
  if(a==="again"){pnew();pdraw();return}
  if(a==="keep"){P.showWin=false;pdraw();return}});
$("play").addEventListener("input",e=>{const t=e.target.closest("[data-name]");if(!t)return;P.names[+t.dataset.name]=t.value;psave()});

/* ---------- Connect Four: say the column's word, then drop a token ---------- */
const C4={};
function c4new(keepWords){const pool=W.length?W:[["",""]];if(!keepWords||!C4.words){let ws=shuffle(pool);while(ws.length<7)ws=ws.concat(shuffle(pool));C4.words=ws.slice(0,7)}
  C4.b=[...Array(6)].map(()=>Array(7).fill(null));C4.turn=C4.turn==null?0:C4.turn;C4.win=null;C4.cells=[];C4.last=null;C4.draw=false;C4.pick=null}
function c4lines(r,c,pl){const dirs=[[0,1],[1,0],[1,1],[1,-1]];for(const [dr,dc] of dirs){const run=[[r,c]];for(const s of [1,-1]){let i=1;while(true){const rr=r+dr*i*s,cc=c+dc*i*s;if(rr<0||rr>5||cc<0||cc>6||C4.b[rr][cc]!==pl)break;run.push([rr,cc]);i++}}if(run.length>=4)return run}return null}
function tokHTML(pl,cls){const t=P.tok[pl];return `<span class="dab ${cls||""}" style="--dc:var(--tok-${t.c})">${t.t==="dot"?"":t.t}</span>`}
function c4draw(){const el=$("c4"),pl=C4.turn,win=C4.win;
  el.innerHTML=`<div class="ptop"><button class="pbtn" data-c="close">Close</button>
    <div class="pcall c4turn" style="--pc:var(--tok-${P.tok[win!=null?win:pl].c})">${win!=null?`<b>${esc(P.names[win])} wins!</b>`:C4.draw?`<b>It's a draw</b>`:`${tokHTML(pl,"mini")}<span><b>${esc(P.names[pl])}</b><small>Say a word, then tap its column</small></span>`}</div>
    <button class="pbtn" data-c="voice" aria-pressed="${P.voice}" title="Say the word when a token drops">Say it</button><button class="pbtn" data-c="words">New words</button><button class="callbig" data-c="again">${win!=null||C4.draw?"Play again":"Restart"}</button></div>
   <div class="c4players">${[0,1].map(i=>`<div class="c4p ${i===pl&&win==null?"on":""}" style="--pc:var(--tok-${P.tok[i].c})"><input data-name="${i}" value="${esc(P.names[i])}" maxlength="12" aria-label="Player name"><button class="tokbtn" data-c="tok" data-v="${i}" aria-expanded="${C4.pick===i}" aria-label="Change token">${tokHTML(i,"mini")}</button></div>`).join("")}</div>
   ${C4.pick!=null?`<div class="tokpick c4pick"><div class="tkrow">${TCOL.map(c=>`<button class="sw ${P.tok[C4.pick].c===c?"on":""}" data-c="tcol" data-v="${c}" aria-label="${c}" style="--dc:var(--tok-${c})"></button>`).join("")}</div><div class="tkrow">${TOKS.map(t=>`<button class="tk ${P.tok[C4.pick].t===t?"on":""}" data-c="ttok" data-v="${t}" aria-label="${t==="dot"?"plain dot":t}"><span class="dab mini" style="--dc:var(--tok-${P.tok[C4.pick].c})">${t==="dot"?"":t}</span></button>`).join("")}</div></div>`:""}
   <div class="c4wrap"><div class="c4b">${C4.words.map((x,c)=>{const full=C4.b[0][c]!=null;return `<button class="c4col" data-c="drop" data-v="${c}" ${full||win!=null?'aria-disabled="true"':""} aria-label="Drop in column ${c+1}, ${esc(x[1])}"><span class="c4word">${x[0]?`<i>${x[0]}</i>`:""}<b>${esc(x[1])}</b></span>${C4.b.map((row,r)=>{const v=row[c],w=C4.cells.some(([a,b])=>a===r&&b===c);return `<span class="slot ${w?"win":""}">${v!=null?tokHTML(v,C4.last&&C4.last[0]===r&&C4.last[1]===c?"drop":""):""}</span>`}).join("")}</button>`}).join("")}</div></div>`;
  const d=el.querySelector(".dab.drop");if(d)d.style.setProperty("--fall",(C4.last[0]+1)*100+"%")}
$("c4btn").onclick=()=>{if(!W.length){flash("Add some words first.");return}C4.turn=0;c4new(false);$("c4").hidden=false;document.documentElement.style.overflow="hidden";c4draw()};
$("c4").addEventListener("click",e=>{const t=e.target.closest("[data-c]");if(!t)return;const a=t.dataset.c;
  if(a==="close"){$("c4").hidden=true;document.documentElement.style.overflow="";return}
  if(a==="again"){C4.turn=C4.win!=null?1-C4.win:0;c4new(true);c4draw();return}
  if(a==="words"){c4new(false);c4draw();return}
  if(a==="voice"){P.voice=!P.voice;psave();c4draw();return}
  if(a==="tok"){const v=+t.dataset.v;C4.pick=C4.pick===v?null:v;c4draw();return}
  if(a==="tcol"){P.tok[C4.pick].c=t.dataset.v;psave();c4draw();return}
  if(a==="ttok"){P.tok[C4.pick].t=t.dataset.v;psave();c4draw();return}
  if(a==="drop"){if(C4.win!=null)return;const c=+t.dataset.v;let r=5;while(r>=0&&C4.b[r][c]!=null)r--;if(r<0)return;const pl=C4.turn;C4.b[r][c]=pl;C4.last=[r,c];C4.pick=null;say(C4.words[c][1]);
    const run=c4lines(r,c,pl);if(run){C4.win=pl;C4.cells=run}else if(C4.b[0].every(v=>v!=null))C4.draw=true;else C4.turn=1-pl;c4draw()}});
$("c4").addEventListener("input",e=>{const t=e.target.closest("[data-name]");if(!t)return;P.names[+t.dataset.name]=t.value;psave()});
let DL=null;(async()=>{try{if(window.claude&&claude.use)DL=await claude.use("downloads")}catch(e){}})();
function flash(t){const m=$("msg");m.textContent=t;m.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(()=>m.hidden=true,4000)}
function loadJS(u){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
$("pdf").onclick=async()=>{const b=$("pdf");if(!W.length){flash("Add some words first.");return}
  b.disabled=true;const t=b.textContent;b.textContent="Making PDF…";
  try{if(!window.html2canvas)await loadJS("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    if(!window.jspdf)await loadJS("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const host=$("pdfhost"),parts=[...document.querySelectorAll("#cards .card")],pdf=new jspdf.jsPDF({unit:"mm",format:"a4"});
    for(let i=0;i<parts.length;i++){host.innerHTML=`<div class="pg">${parts[i].outerHTML}</div>`;const cv=await html2canvas(host.firstChild,{scale:2,backgroundColor:"#fff",logging:false});if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297)}
    host.innerHTML="";const fn=(ST.title||"bingo").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"bingo";
    if(DL)await DL.save({filename:fn+".pdf",data:pdf.output("arraybuffer")});else pdf.save(fn+".pdf");flash("Saved. Open the PDF and print it.")}
  catch(e){const c=e&&e.code;flash(c==="declined"?"Download cancelled.":c==="rate_limited"?"One moment, then try again.":"Couldn't make the PDF. Try again.")}
  b.disabled=false;b.textContent=t};
all();
</script></body></html>
